(function(){
  var yel=document.getElementById('yellow'),red=document.getElementById('red'),logo=document.getElementById('logo');
  var SOFT=18, DUR=5300;               // lebar tepi lembut (%) dan durasi satu siklus (ms)
  var T={headStart:0,headEnd:1900,tailStart:3500,tailEnd:5100}; // ms
  var RED_DELAY=200;                    // garis merah menyusul garis kuning
  function easeOut(t){t=Math.max(0,Math.min(1,t));return 1-(1-t)*(1-t)} // garis langsung melaju di awal
  function easeIn(t){t=Math.max(0,Math.min(1,t));return t*t}               // garis keluar makin cepat di akhir
  function setMask(el,t){
    var head=8+(100+SOFT-8)*easeOut((t-T.headStart)/(T.headEnd-T.headStart));  // mulai tepat di ujung kiri bawah garis
    var tail=-SOFT+(100+SOFT)*easeIn((t-T.tailStart)/(T.tailEnd-T.tailStart)); // selesai tepat di ujung kanan atas garis
    var g='linear-gradient(to top right,transparent '+(tail-SOFT)+'%,#000 '+tail+'%,#000 '+(head-SOFT)+'%,transparent '+head+'%)';
    el.style.webkitMaskImage=g;el.style.maskImage=g;
  }
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t0=performance.now();
  function frame(now){
    var t=(now-t0)%DUR;
    setMask(yel,t);
    setMask(red,Math.max(0,t-RED_DELAY));
    requestAnimationFrame(frame);
  }
  if(reduce){yel.style.webkitMaskImage=yel.style.maskImage=red.style.webkitMaskImage=red.style.maskImage='none';}
  else requestAnimationFrame(frame);
  logo.addEventListener('click',function(){t0=performance.now()});
})();
</script>
</body>
</html>
